name: Deploy Official Website to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Publish Static Website (/website)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Website Dependencies
        working-directory: ./website
        run: npm install

      - name: Build Production Static Site
        working-directory: ./website
        run: npm run build

      - name: Publish Website Bundle to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          force_orphan: true
          commit_message: "chore(website): deploy official PDFly website to GitHub Pages"
